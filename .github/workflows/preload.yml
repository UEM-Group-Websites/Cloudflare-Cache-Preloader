name: Cloudflare Cache Preload

on:
  schedule:
    - cron: "0 * * * *"             # every hour (uem needs ~28-33 min at 500 ms delay)
  workflow_dispatch:
    inputs:
      site:
        description: "Run a single site by name (optional)"
        required: false
        type: string
      dry_run:
        description: "Discover URLs only, don't fetch"
        required: false
        default: false
        type: boolean

concurrency:
  group: cache-preload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preload:
    runs-on: ubuntu-latest
    timeout-minutes: 45              # keep above time_budget_seconds in config/sites.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install Playwright (if any site uses it)
        run: |
          if uv run --locked python -c "from preloader.config import load_config; import sys; sys.exit(0 if any(s.fetcher == 'playwright' for s in load_config('config/sites.yml').resolve()) else 1)"; then
            uv sync --locked --extra playwright
            uv run --locked playwright install --with-deps chromium
          fi

      - name: Run preloader
        env:
          INPUT_SITE: ${{ inputs.site }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--config config/sites.yml)
          if [ -n "$INPUT_SITE" ]; then args+=(--site "$INPUT_SITE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          uv run --locked python -m preloader "${args[@]}"
